<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fridge Bot: Mid-Term Technical Report</title>
<link rel="stylesheet" href="../viewer.css">
<style>
  main { padding: 16px; }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .page { position: relative; width: 100%; max-width: 900px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .page canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<header>
  <h1>Fridge Bot: Mid-Term Technical Report</h1>
  <a href="../">Slides</a>
  <a href="../report.pdf" download="fridgebot-technical-report.pdf">Download report (PDF)</a>
</header>
<main id="stage"><div id="pages" aria-label="Technical report"><p class="msg">Loading the report…</p></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const box = document.getElementById('pages'), stage = document.getElementById('stage');
const pages = [];
async function draw(p) {
  const w = p.el.clientWidth;
  if (p.busy || Math.abs((p.drawnAt || 0) - w) < 40) return;
  p.busy = true;
  try {
    const vp = p.page.getViewport({ scale: Math.min(4, w * (window.devicePixelRatio || 1) / p.page.getViewport({ scale: 1 }).width) });
    const c = document.createElement('canvas');
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    await p.page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    if (p.canvas) p.canvas.replaceWith(c); else p.el.append(c);
    p.canvas = c; p.drawnAt = w;
  } finally { p.busy = false; }
}
pdfjsLib.getDocument('../report.pdf').promise.then(async doc => {
  box.replaceChildren();
  const io = new IntersectionObserver(es => es.forEach(e => {
    const p = pages.find(p => p.el === e.target); p.visible = e.isIntersecting; if (p.visible) draw(p);
  }), { root: stage, rootMargin: '150% 0px' });
  for (let n = 1; n <= doc.numPages; n++) {
    const page = await doc.getPage(n), v = page.getViewport({ scale: 1 });
    const el = document.createElement('div');
    el.className = 'page'; el.id = 'page-' + n; el.setAttribute('aria-label', 'Page ' + n);
    el.style.aspectRatio = v.width + ' / ' + v.height;
    box.append(el); pages.push({ el, page }); io.observe(el);
  }
}).catch(() => { box.innerHTML = '<p class="msg">The report could not load. Use Download report (PDF).</p>'; });
let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => pages.forEach(p => p.visible && draw(p)), 150); });
</script>
</body>
</html>
